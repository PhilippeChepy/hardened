# CMake, for the projects built with it (json-c, LLVM in Rust's build).

version = "4.4.4"
kind = "application"
summary = "CMake build system"
license = "BSD-3-Clause"
homepage = "https://cmake.org"
cpe = "kitware:cmake"

depends-on = ["llvm"]

# What a target building its own CMake changes: its options (after `--`) and environment.
[vars]
prefix = "/usr"
options = []
env = []

[sources.src]
url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}.tar.gz"
sha256 = "bd24c30d80a7744ae84b845ff080cc8453b06c622ef01066564108e9cefc44cf"

# Bootstrapped with make, with its bundled libraries; OpenSSL builds later.
[[build]]
run.cmd = [
    "./bootstrap",
    "--prefix={vars.prefix}",
    "--no-system-libs",
    "--parallel={jobs}",
    "--",
    "-DCMAKE_USE_OPENSSL=OFF",
    "-DBUILD_TESTING=OFF",
    "{vars.options}",
]
run.env = ["{vars.env}"]

[[build]]
make.install = true
