version = "4.4.1"
kind = "application"
summary = "GNU make"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/make/"
cpe = "gnu:make"

depends-on = ["compiler-rt", "musl", "llvm-runtimes"]

# What a target building its own make changes.
[vars]
prefix = "/usr"
args = ["--without-guile"]

[sources.src]
url = "https://ftp.gnu.org/gnu/make/make-{version}.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"

[[build]]
configure.prefix = "{vars.prefix}"
configure.args = ["{vars.args}", "--disable-nls"]
