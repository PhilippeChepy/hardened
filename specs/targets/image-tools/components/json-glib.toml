version = "1.10.8"
kind = "library"
summary = "JSON-GLib, for swtpm"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/json-glib"
cpe = "gnome:json-glib"

depends-on = ["llvm", "meson", "ninja", "pkgconf", "glib"]

[sources.src]
url = "https://download.gnome.org/sources/json-glib/1.10/json-glib-{version}.tar.xz"
sha256 = "55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd"

[[build]]
meson.args = [
    "-Dintrospection=disabled",
    "-Ddocumentation=disabled",
    "-Dtests=false",
    "-Dconformance=false",
    "-Dnls=disabled",
    "-Dinstalled_tests=false",
]
