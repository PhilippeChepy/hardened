# MarkupSafe, for Jinja2: installed from its source, whose pure Python fallback needs no
# compiled extension.

version = "3.0.4"
kind = "library"
summary = "MarkupSafe, for Jinja2"
license = "BSD-3-Clause"
homepage = "https://palletsprojects.com/p/markupsafe/"
purl = "pkg:pypi/markupsafe@{version}"

depends-on = ["llvm", "python"]

[sources.src]
url = "https://files.pythonhosted.org/packages/source/m/markupsafe/markupsafe-{version}.tar.gz"
sha256 = "2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6"

[[build]]
copy.from = "{src}/src/markupsafe"
copy.into = "{dest}/{python.site-packages}"
