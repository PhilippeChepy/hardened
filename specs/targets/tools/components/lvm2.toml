# libdevmapper from LVM2, for veritysetup. Only the device-mapper library and tool are built.

version = "2.03.43"
kind = "library"
summary = "Device-mapper library from LVM2"
license = "GPL-2.0-only AND LGPL-2.1-only"
homepage = "https://sourceware.org/lvm2/"
cpe = "lvm2_project:lvm2"

depends-on = ["llvm", "pkgconf"]

[sources.src]
url = "https://sourceware.org/pub/lvm2/releases/LVM2.{version}.tgz"
sha256 = "d87ec0dac9061f1fa58ebced5c6b1360c87d4c5cd7b455dc0ebe1d3f036920d7"

[[build]]
run.cmd = [
    "./configure",
    "--prefix=/usr",
    "--disable-readline",
    "--disable-selinux",
    "--disable-udev_sync",
    "--disable-udev-systemd-background-jobs",
    "--disable-blkid_wiping",
    "--disable-dmeventd",
    "--disable-cmirrord",
    "--disable-lvmpolld",
    "--disable-nls",
    "--with-thin=none",
    "--with-cache=none",
    "--with-vdo=none",
    "--with-writecache=none",
    "--with-integrity=none",
]

[[build]]
make.args = ["device-mapper"]
make.install = ["install_device-mapper"]
