version = "3.0.10"
kind = "application"
summary = "pkgconf, a pkg-config implementation"
license = "ISC"
homepage = "https://github.com/pkgconf/pkgconf"
cpe = "pkgconf:pkgconf"

depends-on = ["llvm"]

[sources.src]
url = "https://distfiles.ariadne.space/pkgconf/pkgconf-{version}.tar.xz"
sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de"

[[build]]
configure.args = ["--disable-static"]

[[build]]
symlink.target = "pkgconf"
symlink.link = "{dest}/usr/bin/pkg-config"
