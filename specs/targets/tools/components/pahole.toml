version = "1.32"
kind = "application"
summary = "pahole, generating the kernel's BTF"
license = "GPL-2.0-only"
homepage = "https://git.kernel.org/pub/scm/devel/pahole/pahole.git"

depends-on = ["llvm", "cmake", "elfutils", "zlib"]

[sources.src]
url = "https://fedorapeople.org/~acme/dwarves/dwarves-{version}.tar.bz2"
