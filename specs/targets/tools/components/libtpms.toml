version = "0.10.2"
kind = "library"
summary = "libtpms TPM emulation library, for swtpm"
license = "BSD-3-Clause"
homepage = "https://github.com/stefanberger/libtpms"
cpe = "libtpms_project:libtpms"

depends-on = ["llvm", "autoconf", "automake", "libtool", "pkgconf", "openssl"]

[sources.src]
url = "https://github.com/stefanberger/libtpms/archive/refs/tags/v{version}.tar.gz"
sha256 = "edac03680f8a4a1c5c1d609a10e3f41e1a129e38ff5158f0c8deaedc719fb127"

# A git snapshot: no generated configure script.
[[build]]
run.cmd = ["autoreconf", "-fi"]

[[build]]
configure.args = ["--with-openssl", "--with-tpm2", "--disable-static"]
configure.in-tree = true
