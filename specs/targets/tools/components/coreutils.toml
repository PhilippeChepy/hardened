version = "9.12"
kind = "application"
summary = "GNU core utilities"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/coreutils/"
cpe = "gnu:coreutils"

depends-on = ["compiler-rt", "musl", "llvm-runtimes"]

[sources.src]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-{version}.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"

[[build]]
configure.args = [
    "--enable-install-program=hostname",
    "--enable-no-install-program=kill,uptime",
    "--disable-nls",
]
# It refuses to configure as root (the build container's user) otherwise.
configure.env = [["FORCE_UNSAFE_CONFIGURE", "1"]]
