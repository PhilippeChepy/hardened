# qemu-system-x86_64, the machine `cargo builder run` and `test` boot images in, with KVM, a TPM
# (swtpm's socket) and user-mode networking (libslirp). No firmware blobs: OVMF is built from
# source, and the run gives the network card no option ROM.

version = "{qemu.version}"
kind = "application"
summary = "qemu-system-x86_64, the test VM"
license = "GPL-2.0-only"
homepage = "https://www.qemu.org"
cpe = "qemu:qemu"

depends-on = ["llvm", "qemu", "libslirp"]

[sources.src]
from = "qemu"

# Offline: configure installs its Meson and Python tooling from the bundled wheels.
[[build]]
run.cmd = [
    "./configure",
    "--prefix=/usr",
    "--target-list=x86_64-softmmu",
    "--without-default-features",
    "--enable-system",
    "--disable-user",
    "--enable-kvm",
    "--enable-tpm",
    "--enable-slirp",
    "--disable-pixman",
    "--disable-docs",
    "--disable-download",
    "--disable-install-blobs",
]

[[build]]
run.cmd = ["ninja", "-C", "build", "qemu-system-x86_64"]

[[build]]
install.from = "{src}/build/qemu-system-x86_64"
install.to = "{dest}/usr/bin/qemu-system-x86_64"
install.mode = 0o755
