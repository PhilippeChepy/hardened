version = "1.2.7"
kind = "library"
summary = "fts, the file tree walk of glibc and the BSDs, for musl: a static library elfutils links"
license = "BSD-3-Clause"
homepage = "https://github.com/void-linux/musl-fts"

depends-on = ["llvm", "autoconf", "automake", "libtool", "pkgconf"]

[sources.src]
url = "https://github.com/void-linux/musl-fts/archive/v{version}.tar.gz"
sha256 = "49ae567a96dbab22823d045ffebe0d6b14b9b799925e9ca9274d47d26ff482a6"

[[build]]
run.cmd = ["autoreconf", "-fi"]

[[build]]
configure.args = ["--disable-shared", "CFLAGS=-O2 -fPIC"]
configure.in-tree = true
