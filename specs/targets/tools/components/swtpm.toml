version = "0.10.2"
kind = "application"
summary = "swtpm software TPM, for the test VM"
license = "BSD-3-Clause"
homepage = "https://github.com/stefanberger/swtpm"
cpe = "swtpm_project:swtpm"

depends-on = [
    "llvm",
    "autoconf",
    "automake",
    "libtool",
    "pkgconf",
    "glib",
    "json-glib",
    "libtpms",
    "libtasn1",
    "openssl",
    "perl",
]

[sources.src]
url = "https://github.com/stefanberger/swtpm/archive/refs/tags/v{version}.tar.gz"
sha256 = "f61cf6f1e9bbcb4cefb30b70cafaf1c4df54c6961e65cfa63830e8ad0e220134"

# A git snapshot: no generated configure script.
[[build]]
run.cmd = ["autoreconf", "-fi"]

# The socket TPM only: no certificates (GnuTLS, and swtpm_localca's GMP), seccomp profile or
# test suite.
[[build]]
run.cmd = [
    "./configure",
    "--prefix=/usr",
    "--with-openssl",
    "--without-gnutls",
    "--without-seccomp",
    "--without-selinux",
    "--disable-tests",
]

[[build]]
make.dir = "{src}/src"
make.args = ["SUBDIRS=utils swtpm"]
make.install = ["install", "SUBDIRS=utils swtpm"]
