# OVMF, edk2's UEFI firmware for qemu, which `cargo builder run` and `test` boot images with: x86-64,
# 4 MiB flash, TPM 2.0 support. Built with clang (edk2's CLANGDWARF toolchain), nasm and iasl.

version = "stable202608"
kind = "firmware"
summary = "OVMF UEFI firmware (edk2), for the test VM"
license = "BSD-2-Clause-Patent"
homepage = "https://github.com/tianocore/edk2"
cpe = "tianocore:edk2"

depends-on = ["llvm", "python", "nasm", "acpica", "util-linux"]

[vars]
fv = "Build/OvmfX64/RELEASE_CLANGDWARF/FV"

[sources.src]
url = "https://github.com/tianocore/edk2/archive/refs/tags/edk2-{version}.tar.gz"
sha256 = "bac40812213576c3025cf780c33d882f9e087a44201b1cd28a07f6d1eb54b76a"

# The git submodules OVMF builds, at the commits edk2-stable202608 pins.
# OpenSSL 3.5.7, its release tarball (GitHub's commit archives are not byte-stable).
[sources.openssl]
url = "https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz"
sha256 = "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"

[sources.brotli]
url = "https://github.com/google/brotli/archive/e230f474b87134e8c6c85b630084c612057f253e.tar.gz"
sha256 = "a9ba3940267de5dd73581a47c2e81b3eb1e1df6a704138c599020d66f3677a92"

# Their headers are on the include paths of MdePkg, CryptoPkg and SecurityPkg.
[sources.mipisyst]
url = "https://github.com/MIPI-Alliance/public-mipi-sys-t/archive/370b5944c046bab043dd8b133727b2135af7747a.tar.gz"
sha256 = "9fda3b9a78343ab2be6f06ce6396536e7e065abac29b47c8eb2e42cbb4c4f00b"

[sources.mbedtls]
url = "https://github.com/ARMmbed/mbedtls/archive/0bebf8b8c7f07abe3571ded48a11aa907a1ffb20.tar.gz"
sha256 = "61ac65f6362f898677b2a4cf2a769b41e4aee0985cb45f046d3b719388e5be59"

[sources.libspdm]
url = "https://github.com/DMTF/libspdm/archive/f55cf6d48ec69b4ac60a63903e9c6a2cb0fd155d.tar.gz"
sha256 = "a815aa38874d2c82255f379a7ee1eb07cccbb439a7788ff14316fce52d61a516"

[[build]]
copy.from = "{openssl}/*"
copy.into = "{src}/CryptoPkg/Library/OpensslLib/openssl"

[[build]]
copy.from = "{brotli}/*"
copy.into = "{src}/BaseTools/Source/C/BrotliCompress/brotli"

[[build]]
copy.from = "{brotli}/*"
copy.into = "{src}/MdeModulePkg/Library/BrotliCustomDecompressLib/brotli"

[[build]]
copy.from = "{mipisyst}/*"
copy.into = "{src}/MdePkg/Library/MipiSysTLib/mipisyst"

[[build]]
copy.from = "{mbedtls}/*"
copy.into = "{src}/CryptoPkg/Library/MbedTlsLib/mbedtls"

[[build]]
copy.from = "{libspdm}/*"
copy.into = "{src}/SecurityPkg/DeviceSecurity/SpdmLib/libspdm"

# edk2's C tools (GenFw, LzmaCompress...), without -Werror (see below).
[[build]]
make.dir = "{src}/BaseTools"
make.args = ["CC=cc", "CXX=c++", "EXTRA_OPTFLAGS=-Wno-error"]

# Its configuration, from the templates (what edksetup.sh does).
[[build]]
mkdir = "{src}/Conf"

[[build]]
install.from = "{src}/BaseTools/Conf/target.template"
install.to = "{src}/Conf/target.txt"

[[build]]
install.from = "{src}/BaseTools/Conf/tools_def.template"
install.to = "{src}/Conf/tools_def.txt"

# Without -Werror: every clang release warns of more (attribute aliases, unused globals...).
[[build]]
run.cmd = [
    "sed",
    "-i",
    "s/^DEFINE CLANGDWARF_WARNING_OVERRIDES *= /&-Wno-error /",
    "{src}/Conf/tools_def.txt",
]

[[build]]
install.from = "{src}/BaseTools/Conf/build_rule.template"
install.to = "{src}/Conf/build_rule.txt"

[[build]]
run.cmd = [
    "python3",
    "BaseTools/Source/Python/build/build.py",
    "-a",
    "X64",
    "-t",
    "CLANGDWARF",
    "-b",
    "RELEASE",
    "-p",
    "OvmfPkg/OvmfPkgX64.dsc",
    "-n",
    "{jobs}",
    "-D",
    "TPM2_ENABLE=TRUE",
    "-D",
    "FD_SIZE_4MB",
]
run.env = [
    ["WORKSPACE", "{src}"],
    ["EDK_TOOLS_PATH", "{src}/BaseTools"],
    ["CONF_PATH", "{src}/Conf"],
    ["PYTHONPATH", "{src}/BaseTools/Source/Python"],
    ["PATH", "{src}/BaseTools/BinWrappers/PosixLike:/usr/bin:/usr/sbin:/cross/llvm/bin:/cross/bin"],
    ["CLANG_BIN", "/usr/bin/"],
    ["CLANGDWARF_X64_PREFIX", "/usr/bin/"],
    ["NASM_PREFIX", "/usr/bin/"],
    ["IASL_PREFIX", "/usr/bin/"],
    ["PYTHON_COMMAND", "python3"],
]

# Where the run script looks for them (as Debian names them).
[[build]]
install.from = "{src}/{vars.fv}/OVMF_CODE.fd"
install.to = "{dest}/usr/share/OVMF/OVMF_CODE_4M.fd"

[[build]]
install.from = "{src}/{vars.fv}/OVMF_VARS.fd"
install.to = "{dest}/usr/share/OVMF/OVMF_VARS_4M.fd"
