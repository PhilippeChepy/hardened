# kmod, whose depmod the kernel build runs to index its modules (the image loads modules with
# dust-init).

version = "34"
kind = "application"
summary = "kmod, for depmod"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
homepage = "https://github.com/kmod-project/kmod"
cpe = "kernel:kmod"

depends-on = ["llvm", "meson", "ninja", "pkgconf", "zlib", "zstd"]

[sources.src]
url = "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-{version}.tar.xz"
sha256 = "12e7884484151fbd432b6a520170ea185c159f4393c7a2c2a886ab820313149a"

# Its tarball's configure lacks the autotools auxiliary files: Meson is its build system.
[[build]]
meson.args = [
    "-Dzstd=enabled",
    "-Dxz=enabled",
    "-Dzlib=enabled",
    "-Dopenssl=disabled",
    "-Dmanpages=false",
    "-Ddocs=false",
    "-Dbuild-tests=false",
    "-Dbashcompletiondir=no",
    "-Dfishcompletiondir=no",
    "-Dzshcompletiondir=no",
]
