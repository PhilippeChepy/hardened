version = "34"
kind = "application"
summary = "kmod, for depmod, which indexes the kernel's modules at build time"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
homepage = "https://github.com/kmod-project/kmod"
cpe = "kernel:kmod"

depends-on = ["llvm", "meson", "ninja", "pkgconf"]

[sources.src]
url = "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-{version}.tar.xz"
sha256 = "12e7884484151fbd432b6a520170ea185c159f4393c7a2c2a886ab820313149a"

# Its tarball's configure lacks the autotools auxiliary files: Meson is its build system. The
# kernel's modules are neither compressed nor checked by depmod: no compression or OpenSSL.
[[build]]
meson.args = [
    "-Dzstd=disabled",
    "-Dxz=disabled",
    "-Dzlib=disabled",
    "-Dopenssl=disabled",
    "-Dmanpages=false",
    "-Dbashcompletiondir=no",
    "-Dfishcompletiondir=no",
    "-Dzshcompletiondir=no",
]
