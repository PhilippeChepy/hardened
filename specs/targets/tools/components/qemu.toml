version = "11.1.2"
kind = "application"
summary = "qemu-img, converting the image to qcow2"
license = "GPL-2.0-only"
homepage = "https://www.qemu.org"
cpe = "qemu:qemu"

depends-on = [
    "llvm",
    "python",
    "py-setuptools",
    "py-wheel",
    "meson",
    "ninja",
    "pkgconf",
    "glib",
    "zlib",
    "perl",
    "bison",
    "flex",
]

[sources.src]
url = "https://download.qemu.org/qemu-{version}.tar.xz"
sha256 = "731b5681e4bb18be313231579b8efd0296c5b015fa36dc533874b639ba838016"

# Tools only, offline: configure installs its Meson and Python tooling from the bundled
# wheels, next to setuptools and wheel.
[[build]]
run.cmd = [
    "./configure",
    "--prefix=/usr",
    "--without-default-features",
    "--without-default-devices",
    "--disable-system",
    "--disable-user",
    "--disable-docs",
    "--disable-download",
    "--enable-tools",
]

[[build]]
run.cmd = ["ninja", "-C", "build", "qemu-img"]

[[build]]
install.from = "{src}/build/qemu-img"
install.to = "{dest}/usr/bin/qemu-img"
install.mode = 0o755
