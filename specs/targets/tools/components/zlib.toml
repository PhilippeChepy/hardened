version = "1.3.2"
kind = "library"
summary = "zlib compression library"
license = "Zlib"
homepage = "https://zlib.net"
cpe = "zlib:zlib"

depends-on = ["llvm"]

[sources.src]
url = "https://zlib.net/zlib-{version}.tar.xz"
sha256 = "d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3"

# Its shared library test links a test object with zlib's version script, which lld refuses
# (symbols it names are undefined) unless told otherwise: no libz.so then.
[[build]]
run.cmd = ["./configure", "--prefix=/usr"]
run.env = [
    ["CC", "cc"],
    ["LDSHARED", "cc -shared -Wl,-soname,libz.so.1,--version-script,zlib.map,--undefined-version"],
]

[[build]]
make.install = true
