# CMake, static, under /cross: the bootstrap toolset's CMake, built on StageX with its bundled
# libraries, for compiler-rt, libc++ and LLVM.

summary = "CMake, static"
# Built on the seed alone.
depends-on = []

[vars]
prefix = "/cross"
options = ["-DCMAKE_EXE_LINKER_FLAGS=-static"]
# Its first stage too.
env = [["LDFLAGS", "-static"]]
