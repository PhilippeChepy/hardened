environment = "tools"
components = [
    "base-files",
    "ca-certificates",
    "kernel",
    "libseccomp",
    "runc",
    "containerd",
    "libcrypto",
    "libjson-c",
    "libpopt",
    "libdevmapper",
    "libuuid",
    "cryptsetup-luks",
    "e2fsprogs-mke2fs",
    "serviced",
    "system-controllers",
]

kernel-cmdline = [
    "slab_nomerge",
    "init_on_free=1",
    "page_alloc.shuffle=1",
    "randomize_kstack_offset=on",
    "lockdown=integrity",
]

[partition]
esp-size-mib = 64
state-size-mib = 64

[export]
environment = "image-tools"
format = "qcow2"
name = "hardened"
