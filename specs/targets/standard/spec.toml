# The standard image. `cargo builder image --target standard` (the default) builds it.

environment = "tools"
components = [
    "base-files",
    "ca-certificates",
    "kernel",
    "libseccomp",
    "runc",
    "containerd",
    "pause",
    "libcrypto",
    "libjson-c",
    "libpopt",
    "libdevmapper",
    "libuuid",
    "cryptsetup-luks",
    "e2fsprogs-mke2fs",
    "dust",
]

# Added to the kernel command line: hardening options.
kernel-cmdline = [
    "slab_nomerge",
    "init_on_free=1",
    "page_alloc.shuffle=1",
    "randomize_kstack_offset=on",
    "lockdown=integrity",
]

[partition]
esp-size-mib = 64
# Initial size of the state partition; dust-init grows it to the end of the disk.
state-size-mib = 64

[export]
format = "qcow2"
# Its artifacts: build/out/<name>-<version>-x86_64.{qcow2,cdx.json,efi,...}
name = "hardened"
