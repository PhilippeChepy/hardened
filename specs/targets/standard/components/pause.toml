# The Kubernetes pause process: PID 1 of every pod sandbox. Shipped as the "from scratch"
# `localhost/hardened/pause` image, the sandbox image of containerd's CRI plugin.

version = "3.10.2"
kind = "application"
summary = "Kubernetes pause process, PID 1 of pod sandboxes (statically linked)"
license = "Apache-2.0"
homepage = "https://github.com/kubernetes/kubernetes/tree/master/build/pause"
purl = "pkg:generic/kubernetes-pause@{version}"

# From the Kubernetes release it comes with.
[sources.src]
url = "https://raw.githubusercontent.com/kubernetes/kubernetes/v1.37.1/build/pause/linux/pause.c"
sha256 = "14a3fe21ab5f8e62937a2b453e76f3b94b0d3c7c04c3d09bc37195f54c1695ea"

# The sandbox image: the static pause binary, nothing else.
[images.pause]
entrypoint = "/pause"
user = [65535, 65535]

# Static, as upstream builds it: the pause image contains nothing but this binary, musl and
# compiler-rt included (with LTO, as everything that ships).
[[build]]
run.cmd = ["cc", "-Os", "-flto=thin", "-Wall", "-Werror", "-static", "-s", "-DVERSION=v{version}", "-o", "{work:pause}", "{src}"]

[[build]]
install.from = "{work:pause}"
install.to = "{image:pause}/pause"
install.mode = 0o755
