# containerd's configuration. machine-controller adds the registry credentials of
# settings.container-registry to the CRI plugin's `configs` and writes the result to
# /run/containerd/config.toml, which containerd runs with; the mirrors and basic credentials
# (`Authorization` headers) go to `config_path`.
version = 3
# Other components' drop-ins (pause's pins the pod sandbox image).
imports = ["/usr/share/hardened/containerd/conf.d/*.toml"]

disabled_plugins = [
  "io.containerd.internal.v1.tracing",
  "io.containerd.tracing.processor.v1.otlp",
  "io.containerd.nri.v1.nri",
]

[plugins.'io.containerd.cri.v1.images']
  # Unpacked layers are synced before the image is recorded: otherwise a crash (or power loss)
  # soon after a pull leaves an image whose files never reached the disk, which containerd
  # believes complete (programs then fail with "corrupted shared library").
  image_pull_with_sync_fs = true

  [plugins.'io.containerd.cri.v1.images'.registry]
    config_path = "/run/containerd/certs.d"

[plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
  runtime_type = "io.containerd.runc.v2"

  [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
    BinaryName = "/usr/bin/runc"

# CNI only serves kubelet's pods (workloads use the host network): the image's plugins first,
# then those network add-ons install (/opt/cni/bin, a link into /var). The configuration
# directory is on /run, writable. Neither exists in an image without kubelet.
[plugins.'io.containerd.cri.v1.runtime'.cni]
  bin_dirs = ["/usr/libexec/cni", "/opt/cni/bin"]
  conf_dir = "/run/cni/net.d"

# The same for other clients (ctr).
[plugins.'io.containerd.service.v1.diff-service']
  sync_fs = true
