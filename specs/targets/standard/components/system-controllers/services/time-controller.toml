description = "time-controller: keeps the clock in sync with the hypervisor's PTP clock or NTP"
exec = ["/usr/bin/time-controller"]
notify = true
console = true
runtime-directories = ["/run/time-controller"]

[[sockets]]
name = "api"
path = "/run/time-controller/api.sock"
allow = ["machine-controller"]

[sandbox]
user = 65533
capabilities = ["DAC_READ_SEARCH", "SYS_TIME"]
socket-families = ["inet", "inet6"]
ioctls = ["PTP_SYS_OFFSET"]
syscalls = [
    "adjtimex",
    "bind",
    "getdents64",
    "getsockname",
    "recvmsg",
    "rename",
    "sendmsg",
    "setsockopt",
    "socketpair",
]
limits.memory-mib = 32
limits.tasks = 8
limits.cpu-millicores = 100

[[sandbox.binds]]
path = "/etc"

[[sandbox.binds]]
path = "/run/hardened"

[[sandbox.binds]]
path = "/run/time-controller"
writable = true

[[sandbox.binds]]
path = "/dev/ptp0"
device = true
optional = true

[[sandbox.binds]]
path = "/sys/devices/virtual/ptp"
optional = true
