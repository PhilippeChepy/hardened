version = "2026-10-20"
kind = "library"
summary = "Mozilla CA certificate bundle, as extracted by the curl project"
license = "MPL-2.0"
homepage = "https://curl.se/docs/caextract.html"
purl = "pkg:generic/mozilla-ca-certificates@{version}"

[sources.bundle]
url = "https://curl.se/ca/cacert-{version}.pem"
sha256 = "796f1389bfea13c0ed78f663b765baaff54a508e5483786bd6ece73c5e3e3cbe"

# In the image, and where cargo fetches dust's crates (dust builds after it, in the same target).
[[build]]
install.from = "{bundle}"
install.to = "{dest}/etc/ssl/certs/ca-certificates.crt"
