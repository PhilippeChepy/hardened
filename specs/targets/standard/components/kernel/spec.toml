# Linux kernel (longterm), booted as a unified kernel image.
#
# Configured from nothing (`allnoconfig`) with `config.fragment`: KVM/QEMU guests (Exoscale
# included) and what Kubernetes, kube-proxy (nftables, iptables-nft, IPVS), flannel, Calico and
# Cilium (BTF, generated by pahole) need, all built in. Modules stay possible: signed with the
# persistent key of `build/keys/` (lockdown requires signatures) and, through LoadPin, only
# loaded (like firmware) from the dm-verity root.

version = "6.18.58"
kind = "operating-system"
summary = "Linux kernel (longterm), booted as a unified kernel image"
license = "GPL-2.0-only WITH Linux-syscall-note"
homepage = "https://www.kernel.org"
purl = "pkg:generic/linux@{version}"
cpe = "cpe:2.3:o:linux:linux_kernel:{version}:*:*:*:*:*:*:*"

depends-on = [
    "perl",
    "bc",
    "bison",
    "flex",
    "elfutils",
    "openssl",
    "pahole",
    "kmod",
    "python",
    "zstd",
    "lz4",
    "pkgconf",
]

[vars]
# Built with clang, lld and the LLVM tools (`LLVM=1`), host programs included.
make = ["LLVM=1"]
# Pins the build metadata the kernel embeds, for reproducible output.
reproducible = [
    ["KBUILD_BUILD_TIMESTAMP", "@{epoch}"],
    ["KBUILD_BUILD_USER", "hardened"],
    ["KBUILD_BUILD_HOST", "hardened"],
]

[sources.src]
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{version}.tar.xz"
sha256 = "069b19f9032c4dac8149ae4b6520c35debca0f42a9f6d52ee55ba6ca9b818013"

# Fails the build if an option of the fragment does not end up in the final .config.
[[build]]
kernel-config.args = ["{vars.make}"]
kernel-config.fragment = "config.fragment"

# The persistent key, instead of one generated by (and different at) every build.
[[build]]
install.from = "{secret:modules.pem}"
install.to = "{src}/certs/hardened-modules.pem"
install.mode = 0o600

[[build]]
make.args = ["{vars.make}", "-s", "bzImage", "modules"]
make.env = ["{vars.reproducible}"]

# `uname -r`.
[[build]]
capture.cmd = ["make", "{vars.make}", "-s", "kernelrelease"]
capture.into = "{out:kernel.release}"

# modules_install signs the modules (CONFIG_MODULE_SIG_ALL).
[[build]]
run.cmd = ["make", "{vars.make}", "-s", "modules_install", "INSTALL_MOD_STRIP=1", "DEPMOD=depmod", "INSTALL_MOD_PATH={work:modules}"]
run.env = ["{vars.reproducible}"]

[[build]]
copy.from = "{work:modules}/lib/modules/*"
copy.into = "{dest}/usr/lib/modules"

[[build]]
remove = ["{dest}/usr/lib/modules/*/build", "{dest}/usr/lib/modules/*/source"]

# The kernel image booted by the UKI.
[[build]]
install.from = "{src}/arch/x86/boot/bzImage"
install.to = "{out:bzImage}"

# The final kernel configuration, for inspection.
[[build]]
install.from = "{src}/.config"
install.to = "{out:config}"
