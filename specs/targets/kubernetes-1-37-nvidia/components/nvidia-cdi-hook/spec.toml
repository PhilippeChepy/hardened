version = "1.20.1"
kind = "application"
summary = "NVIDIA's CDI hook: the OCI hooks GPU containers' CDI specs name (linker cache, symlinks)"
license = "Apache-2.0"
homepage = "https://github.com/NVIDIA/nvidia-container-toolkit"
purl = "pkg:github/NVIDIA/nvidia-container-toolkit@v{version}"
cpe = "nvidia:container_toolkit"

[sources.src]
url = "https://github.com/NVIDIA/nvidia-container-toolkit/archive/refs/tags/v{version}.tar.gz"
sha256 = "1c5b0f17bd3f56f3d1faa0ddaba8fa0c606fc416aeaf0ee0953265a438fab647"

# go-nvml's dlopen wrapper names two glibc extensions: given values musl's headers lack.
[[build]]
patch.files = ["patches/musl-dlfcn.patch"]

# runc runs it on the host, before a GPU container starts: static, as the image's programs are.
# Its packages reach NVML's dlopen wrapper, which the hooks never call (it fails in a static
# program).
[[build]]
go-build.commands = [["./cmd/nvidia-cdi-hook", "/usr/bin/nvidia-cdi-hook"]]
go-build.cgo = {}

# CRI's CDI specs: where the device plugin and the DRA kubelet plugin write those of the GPUs (a
# directory of /var, which workloads may mount), rather than /etc/cdi and /var/run/cdi.
[[build]]
write.to = "{dest}/usr/share/hardened/containerd/conf.d/nvidia-cdi.toml"
write.contents = """
version = 3

[plugins.'io.containerd.cri.v1.runtime']
  enable_cdi = true
  cdi_spec_dirs = ["/var/lib/cdi"]
"""
