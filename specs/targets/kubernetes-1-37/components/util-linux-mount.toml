version = "{util-linux.version}"
kind = "application"
summary = "mount and umount from util-linux, statically linked"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://github.com/util-linux/util-linux"
cpe = "kernel:util-linux"

[sources.src]
from = "util-linux"

# kubelet runs `mount` and `umount` (k8s.io/mount-utils) for the tmpfs of secrets and projected
# volumes, and for bind mounts. Only the static programs (libmount and libblkid linked in, with
# ThinLTO) ship: the rest of the install stays in scratch space. Not setuid.
[[build]]
configure.dest = "{work:install}"
configure.args = [
    "--disable-all-programs",
    "--enable-mount",
    "--enable-libmount",
    "--enable-libblkid",
    "--enable-static-programs=mount,umount",
    "--disable-shared",
    "--bindir=/usr/bin",
    "--sbindir=/usr/sbin",
    "--libdir=/usr/lib",
    "--disable-nls",
    "--without-python",
    "--without-systemd",
    "--without-udev",
    "--disable-makeinstall-chown",
    "--disable-makeinstall-setuid",
    "CFLAGS=-O2 -flto=thin",
]

[[build]]
install.from = "{work:install}/usr/bin/mount.static"
install.to = "{dest}/usr/bin/mount"
install.mode = 0o755

[[build]]
install.from = "{work:install}/usr/bin/umount.static"
install.to = "{dest}/usr/bin/umount"
install.mode = 0o755
