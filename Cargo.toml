[workspace]
resolver = "3"
members = [
    "crates/containerd-api",
    "crates/cri-api",
    "crates/dust-builder",
    "crates/dust-init",
    "crates/dust-api",
    "crates/dust-ntp",
    "crates/dust-proto",
    "crates/hctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/PhilippeChepy/hardened"
publish = false

[workspace.dependencies]
# In-tree crates
containerd-api = { path = "crates/containerd-api" }
cri-api = { path = "crates/cri-api" }
dust-ntp = { path = "crates/dust-ntp" }
dust-proto = { path = "crates/dust-proto" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4"
libc = "0.2"
prost = "0.14.4"
prost-types = "0.14.4"
prost-build = "0.14"
protox = "0.10.0"
rustix = { version = "1.1.5", features = ["fs", "mount", "process", "system", "net", "termios", "thread", "time", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.47", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "fs", "io-util", "time", "signal", "sync", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1.1.8"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "router", "server", "channel"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false, features = ["transport"] }
tower = "0.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
gpt = "4.1.0"
dhcproto = "0.15.0"
rtnetlink = "0.23.0"
oci-spec = { version = "0.10.0", default-features = false, features = ["runtime", "image"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
tempfile = "3.27.0"
x509-parser = "0.18.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
