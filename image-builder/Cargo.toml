[package]
name = "image-builder"
description = "hardened build system: builds every component from source, assembles the OS image, its SBOM, and runs it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
gpt.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
toml.workspace = true
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
uuid.workspace = true
walkdir = "2.5.0"

[dev-dependencies]
tempfile.workspace = true

[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/PhilippeChepy/hardened"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
gpt = "4.1.0"
tempfile = "3.27.0"
uuid = "1.29.0"

[workspace.lints.clippy]
# No panic on a failure in production code: tests may (clippy.toml).
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints]
workspace = true
