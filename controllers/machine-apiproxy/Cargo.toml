[package]
name = "machine-apiproxy"
description = "The machine's API over mutual TLS: authorizes each call by its client's role, then forwards it to machine-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
controllers-helpers.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["server-graceful"] }
libserviced.workspace = true
prost.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true

[dev-dependencies]
controllers-helpers = { workspace = true, features = ["testing"] }
rcgen.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
workload-controller.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false
