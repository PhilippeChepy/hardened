[package]
name = "controllers-helpers"
description = "The validated values several services of hardened share, the helpers of their settings and protobuf conversions, and gRPC channels to unix sockets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
libserviced.workspace = true
rcgen = { workspace = true, optional = true }
rustls-pki-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["util"] }

[features]
# Certificates for the tests of the crates using these types.
testing = ["dep:rcgen"]

[dev-dependencies]
libserviced = { workspace = true, features = ["testing"] }
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-stream.workspace = true

[lints]
workspace = true
