syntax = "proto3";

// The API's workloads, served by workload-controller (/run/workload-controller/api.sock) and
// forwarded by machine-controller.
package hardened.workloads.v1;

import "google/protobuf/empty.proto";

// Containers run through containerd, one serviced service each (workload-controller).
service Workloads {
  rpc List(google.protobuf.Empty) returns (ListWorkloadsResponse);
  // Creates or replaces a workload. API-managed workloads persist across reboots.
  rpc Apply(ApplyWorkloadRequest) returns (Workload);
  rpc Remove(WorkloadRef) returns (google.protobuf.Empty);
  rpc Restart(WorkloadRef) returns (google.protobuf.Empty);
  rpc Logs(WorkloadLogsRequest) returns (stream LogChunk);
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;  // defaults to ALWAYS
  RESTART_POLICY_ALWAYS = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_NEVER = 3;
}

enum WorkloadSource {
  WORKLOAD_SOURCE_UNSPECIFIED = 0;
  WORKLOAD_SOURCE_USER_DATA = 1;
  WORKLOAD_SOURCE_API = 2;
}

message Mount {
  string source = 1;
  string destination = 2;
  bool read_only = 3;
}

message WorkloadSpec {
  string image = 1;
  // The program and its arguments, replacing the image's entrypoint and command when non-empty.
  repeated string command = 2;
  map<string, string> env = 3;
  bool privileged = 4;
  RestartPolicy restart = 5;
  repeated Mount mounts = 6;
  // Also copies the workload's output to the serial console (debugging, smoke tests).
  bool console = 7;
}

// A workload of user-data (settings.hardened.containers.<name>).
message DeclaredWorkload {
  string name = 1;
  // When false, declared but not run.
  bool enabled = 2;
  WorkloadSpec spec = 3;
}

// settings.hardened.containers.
message DeclaredWorkloads {
  repeated DeclaredWorkload workloads = 1;
}

message ApplyWorkloadRequest {
  string name = 1;
  WorkloadSpec spec = 2;
}

message WorkloadRef {
  string name = 1;
}

message Workload {
  string name = 1;
  WorkloadSpec spec = 2;
  WorkloadSource source = 3;
  uint32 restarts = 4;
  // Lifecycle state, with the data only meaningful in it.
  oneof state {
    Pending pending = 5;
    Pulling pulling = 6;
    Running running = 7;
    Exited exited = 8;
    Failed failed = 9;
  }

  // Waiting for what it requires, or to restart; or stopped.
  message Pending {}
  // Pulling its image.
  message Pulling {}
  message Running {
    uint32 pid = 1;
  }
  message Exited {
    int32 exit_code = 1;
  }
  // Could not be started, or exited and is not restarted.
  message Failed {
    string reason = 1;
  }
}

message ListWorkloadsResponse {
  repeated Workload workloads = 1;
}

message WorkloadLogsRequest {
  string name = 1;
  bool follow = 2;
  // Number of past lines to send first; 0 means all retained.
  uint32 tail = 3;
}

message LogChunk {
  bytes data = 1;
}
