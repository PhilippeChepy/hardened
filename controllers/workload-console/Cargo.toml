[package]
name = "workload-console"
description = "Processes run in the containers of hardened's workloads, on a terminal or pipes, for the machine API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
controllers-helpers.workspace = true
libserviced.workspace = true
prost.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }
serde.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false
