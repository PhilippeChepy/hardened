syntax = "proto3";

// Attestation evidence, served by trust-controller (/run/trust-controller/api.sock) and forwarded
// by machine-controller.
package hardened.attestation.v1;

import "google/protobuf/empty.proto";

// Remote attestation evidence from the (v)TPM.
service Attestation {
  rpc Pcrs(PcrsRequest) returns (PcrsResponse);
  // Raw TCG event log (firmware + systemd-stub measurements).
  rpc EventLog(google.protobuf.Empty) returns (EventLogResponse);
  // TPM2_Quote over the selected PCRs, signed by trust-controller's attestation key.
  rpc Quote(QuoteRequest) returns (QuoteResponse);
  // The TPM's endorsement key (EK), with its certificate if the TPM holds one, and the
  // attestation key.
  rpc EndorsementKey(EndorsementKeyRequest) returns (EndorsementKeyResponse);
  // TPM2_ActivateCredential of a credential a verifier made for the attestation key and the EK:
  // its secret comes back only from the TPM holding both.
  rpc ActivateCredential(ActivateCredentialRequest) returns (ActivateCredentialResponse);
}

// The TCG EK Credential Profile's low-range templates.
enum EndorsementKeyType {
  ENDORSEMENT_KEY_TYPE_UNSPECIFIED = 0;  // defaults to RSA_2048
  ENDORSEMENT_KEY_TYPE_RSA_2048 = 1;
  ENDORSEMENT_KEY_TYPE_ECC_P256 = 2;
}

enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;  // defaults to SHA256
  HASH_ALGORITHM_SHA1 = 1;
  HASH_ALGORITHM_SHA256 = 2;
  HASH_ALGORITHM_SHA384 = 3;
}

message PcrsRequest {
  HashAlgorithm bank = 1;
  // PCR indexes; empty means 0-23.
  repeated uint32 pcrs = 2;
}

message PcrValue {
  uint32 index = 1;
  bytes digest = 2;
}

message PcrsResponse {
  HashAlgorithm bank = 1;
  repeated PcrValue values = 2;
}

message EventLogResponse {
  bytes event_log = 1;
}

message QuoteRequest {
  // Verifier-chosen freshness nonce (TPM2 qualifying data), at most 64 bytes.
  bytes nonce = 1;
  HashAlgorithm bank = 2;
  repeated uint32 pcrs = 3;
}

message QuoteResponse {
  // TPMS_ATTEST structure, marshalled (TPM2B contents).
  bytes attest = 1;
  // TPMT_SIGNATURE, marshalled.
  bytes signature = 2;
  // TPMT_PUBLIC of the attestation key, marshalled.
  bytes ak_public = 3;
  repeated PcrValue values = 4;
}

message EndorsementKeyRequest {
  EndorsementKeyType type = 1;
}

message EndorsementKeyResponse {
  // TPMT_PUBLIC of the EK, marshalled.
  bytes ek_public = 1;
  // The EK certificate of the TPM's NV index, DER; empty when the TPM holds none.
  bytes certificate = 2;
  // TPMT_PUBLIC of the attestation key, marshalled.
  bytes ak_public = 3;
}

message ActivateCredentialRequest {
  EndorsementKeyType type = 1;
  // TPM2B_ID_OBJECT contents.
  bytes credential_blob = 2;
  // TPM2B_ENCRYPTED_SECRET contents.
  bytes secret = 3;
}

message ActivateCredentialResponse {
  bytes credential = 1;
}
