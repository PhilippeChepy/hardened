[package]
name = "trust-controller"
description = "The TPM's only user: attestation evidence and secrets sealed to the booted image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
cfb-mode = { workspace = true, optional = true }
controllers-helpers.workspace = true
hex.workspace = true
libserviced.workspace = true
num-bigint = { workspace = true, optional = true }
prost.workspace = true
ring = { workspace = true, optional = true }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[features]
# What verifies the TPM's evidence away from the machine (hctl): quotes, and credentials made for
# its keys. The machine's trust-controller does without its crypto.
verifier = ["dep:aes", "dep:cfb-mode", "dep:num-bigint", "dep:ring"]

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false

[lints]
workspace = true
