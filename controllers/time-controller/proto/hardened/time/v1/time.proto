syntax = "proto3";

// time-controller's API (/run/time-controller/api.sock): the clock's synchronization, with the
// hypervisor's PTP clock or NTP servers.
package hardened.time.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TimeController {
  rpc Configure(Configuration) returns (google.protobuf.Empty);
  rpc GetStatus(google.protobuf.Empty) returns (Status);
}

// Where the time servers come from.
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  // settings.ntp.time-servers.
  ORIGIN_SETTINGS = 1;
  // DHCP (option 42).
  ORIGIN_DHCP = 2;
  // The default: pool.ntp.org.
  ORIGIN_DEFAULT = 3;
}

// What the clock is synchronized with.
enum Source {
  // The hypervisor's PTP clock (KVM's) when there is one, NTP otherwise or when it fails.
  SOURCE_AUTO = 0;
  // The hypervisor's PTP clock only.
  SOURCE_PTP = 1;
  // The NTP servers only.
  SOURCE_NTP = 2;
}

message Configuration {
  // Host names or IP addresses, in order of preference; at least one.
  repeated string servers = 1;
  Origin origin = 2;
  Source source = 3;
}

message Status {
  // The kernel clock's state.
  Clock clock = 1;
  // The servers queried, in order of preference, and where they come from.
  repeated string servers = 2;
  Origin origin = 3;
  // The last correction, if any.
  optional Correction last_correction = 4;
  // Why the last round corrected nothing, if it did not.
  optional string error = 5;
  // Seconds between rounds.
  uint32 poll_interval_seconds = 6;
  Source source = 7;
}

message Clock {
  // Whether the kernel considers the clock synchronized: corrected recently enough that its
  // maximum error stays below 16 s.
  bool synchronized = 1;
  // The kernel's estimate of the clock's error, and its bound.
  uint64 estimated_error_us = 2;
  uint64 max_error_us = 3;
  // The frequency correction the kernel applies, in parts per million.
  double frequency_ppm = 4;
}

// A correction of the clock, and what it came from.
message Correction {
  oneof source {
    NtpReply ntp = 1;
    PtpClock ptp = 2;
  }
  // What the clock was corrected by (positive: it was behind), and the delay of the
  // measurement: the round trip to the server less its processing time, or the time the
  // system clock took to read the PTP clock.
  int64 offset_ns = 5;
  int64 delay_ns = 6;
  // Whether the clock was stepped rather than slewed.
  bool stepped = 7;
  google.protobuf.Timestamp corrected_at = 8;
}

// The NTP reply a correction came from.
message NtpReply {
  // The server as configured, and the address that replied.
  string server = 1;
  string address = 2;
  // The server's stratum and reference: its clock's code at stratum 1, the address of its own
  // server above.
  uint32 stratum = 3;
  string reference = 4;
}

// The PTP clock a correction came from.
message PtpClock {
  // Its device, and the name its driver gives it ("KVM virtual PTP").
  string device = 1;
  string name = 2;
}
