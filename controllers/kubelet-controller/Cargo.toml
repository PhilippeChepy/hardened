[package]
name = "kubelet-controller"
description = "kubelet's configuration on hardened: its files, and its service enabled"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
controllers-helpers.workspace = true
http.workspace = true
libserviced.workspace = true
prost.workspace = true
prost-types.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Settings for the tests of kubelet-controller's users.
testing = ["controllers-helpers/testing"]

[dev-dependencies]
controllers-helpers = { workspace = true, features = ["testing"] }
libserviced = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lib]
# Generated code: proto comments are not Rust doctests.
doctest = false
