# User-data of `cargo builder test`: an encrypted state partition (the test boots the same disk
# twice), and one short-lived workload whose output dust-init forwards to the console, where the
# test looks for it.

[settings.network]
hostname = "smoke"

[settings.hardened.storage]
encryption = "tpm"

[settings.hardened.containers.hello]
image = "docker.io/library/busybox:1.37"
command = ["sh", "-c", "echo hello from a hardened workload; cat /proc/self/cgroup"]
restart = "never"
console = true
