[package]
name = "dust-builder"
description = "hardened build system: builds every component from source, assembles the OS image, its SBOM, and runs it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
const_format = "0.2.37"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
gpt.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
toml.workspace = true
ureq = "3.5.0"
uuid = "1.29.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile.workspace = true
